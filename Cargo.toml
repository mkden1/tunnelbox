[package]
name = "tunnelbox-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
# Core
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# VPN
boringtun = "0.6"
ipnet = "2"
base64 = "0.22"

# Windows APIs
windows = { version = "0.52.0", features = [
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Rpc",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    "Win32_System_Memory",
    "Win32_System_Services",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
]}

# Windows Service
windows-service = "0.7"

# Utilities
uuid = { version = "1", features = ["v4"] }
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
configparser = "3"
windivert-sys = "0.10"
# WinDivert's FFI uses windows 0.48 types; alias it so we can name the HANDLE
# type its functions expect (the rest of the daemon is on windows 0.52).
windivert-windows = { package = "windows", version = "0.48", features = ["Win32_Foundation"] }
socket2 = { version = "0.5", features = ["all"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Security",
    "Win32_Storage_FileSystem",
]}
tracing-appender = "0.2"